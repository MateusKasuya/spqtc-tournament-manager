# Supabase local para os testes e2e (ADR 0003). Só configura os serviços:
# o schema chega pelo `pnpm db:migrate` (Drizzle), nunca por supabase/migrations.
# Referência das chaves: https://supabase.com/docs/guides/local-development/cli/config
project_id = "spqc-tournament-manager"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
# O schema vem do Drizzle; não há supabase/migrations.
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
# Cadastro loga direto, sem email de confirmação.
enable_confirmations = false
double_confirm_changes = false
