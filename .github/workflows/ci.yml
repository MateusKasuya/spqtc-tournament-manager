name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Schema de teste em sincronia com o schema TS
        run: |
          pnpm test:schema
          git diff --exit-code src/test/schema.sql

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # E2E com Playwright contra o Supabase local (ADR 0003). Separado do verify e
  # sem nenhum secret: tudo aponta para o Supabase que o próprio job sobe.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      - name: Supabase local
        run: pnpm supabase:start

      - name: Migrations do zero
        run: pnpm e2e:migrate

      - name: Build
        run: pnpm e2e:build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Navegadores do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: Relatorio do Playwright (trace, screenshot e video das falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
